<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinMind AI — AI Chat</title>
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body data-page="ai-chat" data-title="AI Chat" data-subtitle="Trò chuyện với trợ lý tài chính cá nhân của bạn">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <h2>AI Chat</h2>
          <p>Hỏi bất cứ điều gì về thu chi, ngân sách hay mục tiêu — trả lời dựa trên dữ liệu thật của bạn.</p>
        </div>
        <div class="head-actions">
          <button class="btn btn-ghost" id="clearBtn">Xóa cuộc trò chuyện</button>
        </div>
      </div>

      <div class="chat-shell">
        <div class="card card-pad" style="display:flex;flex-direction:column;">
          <div class="flex items-center justify-between" style="margin-bottom:12px;">
            <h3 style="font-size:14px;">Cuộc trò chuyện</h3>
            <button class="icon-btn" style="width:32px;height:32px;" id="newConvBtn" title="Cuộc trò chuyện mới"></button>
          </div>
          <div class="chat-list" id="chatList"></div>
        </div>

        <div class="card card-pad chat-window">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-quick" id="quickPrompts"></div>
          <div class="chat-input-row">
            <button class="icon-btn" id="attachBtn"></button>
            <input type="text" id="chatInput" placeholder="Nhập câu hỏi của bạn…" />
            <button class="send-btn" id="sendBtn"></button>
          </div>
          <div class="chat-foot-note">AI có thể mắc sai sót. Vui lòng kiểm tra thông tin quan trọng.</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:18px;">
          <div class="card card-pad">
            <div class="card-head"><h3>Tóm tắt ngữ cảnh</h3></div>
            <div id="contextStats"></div>
          </div>
          <div class="card card-pad">
            <div class="card-head"><h3>Danh mục nổi bật</h3></div>
            <div id="topCats"></div>
          </div>
          <div class="card card-pad" style="background:var(--purple-bg);border:none;">
            <div class="flex gap-10 items-center" style="margin-bottom:8px;">
              <div class="stat-icon purple" style="background:#fff;" id="tipIcon"></div>
              <h4 style="font-size:13px;">Mẹo từ AI</h4>
            </div>
            <p id="tipText" style="font-size:12px;font-weight:700;color:var(--ink-700);line-height:1.5;"></p>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts-common.js"></script>
<script src="js/ai-chat.js"></script>
</body>
</html>
