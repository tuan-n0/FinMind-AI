<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinMind AI — Mục tiêu tiết kiệm</title>
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body data-page="goals" data-title="Mục tiêu tiết kiệm" data-subtitle="Theo dõi tiến độ chinh phục các cột mốc tài chính">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <h2>Mục tiêu tiết kiệm</h2>
          <p>Theo dõi tiến độ và chinh phục những mục tiêu tài chính của bạn.</p>
        </div>
        <div class="head-actions">
          <button class="btn btn-primary" onclick="openGoalForm()"><span id="plusIcon"></span>Tạo mục tiêu mới</button>
        </div>
      </div>

      <div class="grid grid-4" id="statGrid"></div>

      <div class="grid grid-main-side mt-20">
        <div class="card card-pad">
          <div class="card-head"><h3>Danh sách mục tiêu</h3></div>
          <div id="goalList" style="display:flex;flex-direction:column;gap:16px;"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:18px;">
          <div class="card card-pad">
            <div class="panel-ai-header">
              <div class="stat-icon" id="aiIcon"></div>
              <div><h3>AI huấn luyện tài chính</h3><p class="card-sub">Đồng hành cùng bạn đạt mục tiêu</p></div>
            </div>
            <div id="aiCoachSummary"></div>
          </div>
          <div class="card card-pad">
            <div class="card-head"><h3>Trạng thái mục tiêu</h3></div>
            <div id="goalStatusList"></div>
          </div>
          <div class="card card-pad">
            <div class="card-head"><h3>Gợi ý từ AI</h3></div>
            <div id="aiTipsBox"></div>
            <div class="disclaimer" id="aiDisclaimer"></div>
          </div>
        </div>
      </div>

      <div class="card card-pad mt-20">
        <div class="card-head"><h3>Lộ trình &amp; Cột mốc</h3></div>
        <div class="timeline" id="timelineBox"></div>
      </div>

    </main>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/ui.js"></script>
<script src="js/goals.js"></script>
</body>
</html>
